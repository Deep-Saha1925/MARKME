<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkMe — Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-mark">M</span>
      <span class="logo-text">MarkMe</span>
    </div>
    <p class="auth-sub">Attendance made simple</p>

    <div id="error-msg" class="error-box hidden"></div>
    <div id="success-msg" class="success-box hidden"></div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@college.edu" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="field">
      <label for="role">Login as</label>
      <select id="role">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <button id="login-btn" onclick="handleLogin()">Sign in</button>

    <!-- Divider -->
    <div class="auth-divider">
      <span>New student?</span>
    </div>

    <a href="signup.html" class="btn-outline">
      Create student account
    </a>

  </div>

  <script src="../js/login.js"></script>
</body>
</html>
